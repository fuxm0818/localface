<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalFace</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(1100px 520px at 12% -12%, rgba(59, 130, 246, .12), transparent 62%),
      radial-gradient(900px 480px at 100% 0%, rgba(16, 185, 129, .08), transparent 55%),
      #0d0f13;
    color: #e9edf3;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .box { width: 380px; text-align: center; }
  .logo {
    width: 84px; height: 84px; margin: 0 auto 22px;
    display: grid; place-items: center;
    border-radius: 24px;
    background: linear-gradient(160deg, #16463a, #06150f);
    border: 1px solid #2b4a40;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .45);
    font-size: 34px; font-weight: 700; color: #f2fff9;
  }
  h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: .5px; }
  p { margin: 0; color: #9aa4b5; font-size: 14px; }
  .bar { height: 4px; margin: 26px 0 14px; border-radius: 999px; background: #1d222c; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 8%; border-radius: 999px; background: linear-gradient(90deg, #2563eb, #34d399); transition: width .6s ease; }
  .status { min-height: 22px; font-size: 13px; color: #707b8d; }
  .status.error { color: #f87171; white-space: pre-wrap; word-break: break-word; text-align: left; }
  .hint { margin-top: 18px; font-size: 12px; color: #707b8d; }
  code { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9aa4b5; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">L</div>
    <h1>LocalFace</h1>
    <p>正在启动本地识别服务…</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="status" id="status">正在加载人脸模型，第一次启动需要几秒钟</div>
    <div class="hint" id="hint">画面只在本机处理，不会上传任何服务器</div>
  </div>
<script>
  let progress = 8;
  const bar = document.getElementById('bar');
  const status = document.getElementById('status');
  const hint = document.getElementById('hint');
  const timer = setInterval(() => {
    progress = Math.min(88, progress + Math.max(1, (90 - progress) * 0.08));
    bar.style.width = progress.toFixed(1) + '%';
  }, 300);

  window.__backendReady = port => {
    clearInterval(timer);
    bar.style.width = '100%';
    status.textContent = '服务已就绪，正在进入…';
    status.className = 'status';
    setTimeout(() => location.replace('http://127.0.0.1:' + port + '/'), 120);
  };

  window.__backendFailed = message => {
    clearInterval(timer);
    bar.style.width = '100%';
    bar.style.background = '#f87171';
    status.className = 'status error';
    status.textContent = '启动失败：' + message;
    hint.innerHTML = '日志：<code id="logPath"></code><br>修复后重新打开应用即可。';
  };

  window.__setLogPath = path => {
    const el = document.getElementById('logPath');
    if (el) el.textContent = path;
  };
</script>
</body>
</html>
